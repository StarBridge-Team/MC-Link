[package]
name = "mc-link"
version = "0.4.0"
description = "MC Link - 我的世界联机工具"
authors = ["Cugo,棱镜Prism工作室"]
edition = "2021"

[lib]
name = "mc_link_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
rand = "0.8"
uuid = { version = "1.0", features = ["v4"] }
raw-window-handle = "0.6"
uapi-sdk-rust = "0.1.15"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "net", "time"] }
tracing = "0.1"
reqwest = { version = "0.12", features = ["blocking", "stream"] }
futures-util = "0.3"
tar = "0.4"
flate2 = "1"
rand_core = { version = "0.6", features = ["std"] }
local-ip-address = "0.5"
tokio-util = "0.7"
hex = "0.4"
sha2 = "0.10"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = "2"

# 插件系统：WebSocket 网关（仅监听回环地址）与端到端加密
tokio-tungstenite = "0.24"
aes-gcm = "0.10"
hmac = "0.12"
hkdf = "0.12"
base64 = "0.22"
zeroize = { version = "1", features = ["zeroize_derive"] }
subtle = "2"

# M3 (Material Design 3) 动态配色引擎：从种子颜色生成色调调色板、明暗主题映射与颜色角色分配
# 成熟稳定的 Rust crate 实现：https://crates.io/crates/material-colors
material-colors = "0.3"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
