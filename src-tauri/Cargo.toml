[package]
name = "mc-link"
version = "0.5.4"
description = "MC Link - 我的世界联机工具"
authors = ["Cugo,棱镜Prism工作室"]
edition = "2021"

[lib]
name = "mc_link_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
rand = "0.8"
uuid = { version = "1.0", features = ["v4"] }
raw-window-handle = "0.6"
uapi-sdk-rust = "0.1.15"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "net", "time"] }
tracing = "0.1"
reqwest = { version = "0.12", features = ["blocking", "stream"] }
futures-util = "0.3"
tar = "0.4"
flate2 = "1"
rand_core = { version = "0.6", features = ["std"] }
local-ip-address = "0.5"
tokio-util = "0.7"
hex = "0.4"
sha2 = "0.10"
tauri-plugin-deep-link = "2"
# `deep-link` feature 是必需的，不是可选优化：
# 不开启时，**程序已在运行时**点击 `mclink://` 链接，第二份进程被单实例拦截、
# 通过 WM_COPYDATA 把 argv 送进回调，而插件此时**不会**把参数转交 deep-link 插件
# （转发代码被 `#[cfg(feature = "deep-link")]` 包着，见
#  tauri-plugin-single-instance-2.4.3/src/lib.rs:72-75）。
# 后果是该次深链被静默丢弃——用户点了链接却什么都没发生，且没有任何日志。
# 冷启动（程序没开）不受影响，因为它走 deep-link 自己解析 CLI 的路径。
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

# 剪切板：由后端提供命令，前端不申请剪贴板权限（见 `commands/clipboard.rs`）。
# 刻意不用 `tauri-plugin-clipboard-manager`：它在 Windows 上会把整个 gtk 依赖树
# （gtk、gdk、glib、cairo、pango…）拉进 Cargo.lock，而这里只需要「写文本」一件事。
# arboard 是跨平台的最小实现，两者在 Linux 上底层是同一套 x11rb 通路。
# 移动端没有系统剪贴板可写，故不参与编译。
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
arboard = "3"

# 插件系统：WebSocket 网关（仅监听回环地址）与端到端加密
tokio-tungstenite = "0.24"
aes-gcm = "0.10"
hmac = "0.12"
hkdf = "0.12"
base64 = "0.22"
zeroize = { version = "1", features = ["zeroize_derive"] }
subtle = "2"

# M3 (Material Design 3) 动态配色引擎：从种子颜色生成色调调色板、明暗主题映射与颜色角色分配
# 成熟稳定的 Rust crate 实现：https://crates.io/crates/material-colors
#
# `image` feature 提供「从图片提取种子色」（`material_colors::image`），用于"配色跟随
# 背景图"。它只额外拉入 `image` crate 0.25（其默认 features 已覆盖 png/jpeg/webp/gif），
# 不必自己写中位切分量化与打分。
material-colors = { version = "0.3", features = ["image"] }
# 直接依赖 `image`（与 material-colors 内部用的是同一份，不会重复编译）：
# 取色前需要**只看表头**拿到像素尺寸，以挡住"几百字节的 PNG 声明成 30000×30000"
# 这类解码炸弹。material_colors 只导出 `ImageReader::read`（整图解码），
# 没有只读尺寸的入口，因此这里自己读。
# 默认 features 已覆盖 png/jpeg/webp/gif；不关默认项以免与 material-colors 复用出两份。
image = "0.25"
tauri-plugin-updater = "2.13.1"
minisign-verify = "0.3"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
# Microsoft 官方维护的 Win32 绑定。
#
# 目前**只剩一处**用途：`effect.rs` 调 DwmApi 设置沉浸式深色模式
# （`DwmSetWindowAttribute`）。Tauri 没有等价 API，这一步必须自己调系统；
# 但手写 `#[link(name = "dwmapi")]` + `extern "system"` 声明一旦签名写错就是 UB，
# 且常量 `DWMWA_USE_IMMERSIVE_DARK_MODE` 在旧 SDK 里是 19、新的是 20，也要自己维护。
#
# 另一处（托盘菜单取光标位置）已删除：`TrayIconEvent::Click` 自带 `position` 字段，
# 由 Tauri 跨平台提供，不必自己查系统光标。
#
# 版本与 Tauri 自身依赖的 0.61 对齐，避免引入第二份 windows-sys 编译单元。
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
] }

[target.'cfg(target_os = "macos")'.dependencies]
# 与 Tauri 内部同款的材质库。目前只用于一件事：`set_effects(None)` 在 macOS 上
# 是 no-op（Tauri 的 "清空材质" 分支只对 Windows 生效），需要请它来做真正的移除。
window-vibrancy = "0.6"
