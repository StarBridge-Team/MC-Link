[package]
name = "mclink-plugin-sdk"
version = "1.0.0"
edition = "2021"
description = "MC Link 插件 SDK（Rust）：握手、加密会话、方法分发与插件间通信"
license = "GPL-3.0"
repository = "https://github.com/Cugo-Y/MC-Link"

# 独立 crate：插件作者按 path 依赖引入，或复制到自己仓库。
# 版本刻意与核心对齐（协议 v1），升级协议时两边一起改。

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
aes-gcm = "0.10"
hex = "0.4"
base64 = "0.22"
rand = "0.8"
