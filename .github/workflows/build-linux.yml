# 可复用的 Linux 构建：产出 .deb / .AppImage / 裸二进制 / .flatpak。
#
# # 与 build-windows.yml 的分工
#
# 两者都是 `workflow_call` 可复用工作流，由 release.yml 与 auto-release.yml 各自调用。
# **不合并成一个 job**：Flatpak 需要 `--privileged` 容器（flatpak-builder 要建挂载命名空间），
# 而 Windows 构建是普通用户态 runner；混在一个 job 里既跑不通也难以排查。
#
# # 产物
#
#   .deb              系统包（apt 安装；也被 Flatpak manifest 用作输入）
#   .AppImage         单文件，免安装；当前是**唯一**能被官方更新插件自动替换的 Linux 形态
#   裸二进制           无后缀可执行文件（依赖系统 WebKitGTK，**不能独立运行**）
#   .flatpak          沙箱包；手动安装 + 经自建 OSTree remote 更新
#
# # 触发
#
# 只在发布路径（release.yml 推 tag / auto-release.yml 版本号变更）被调用。
# 不在每次 push 跑：Flatpak 构建要拉 GNOME runtime、跑沙箱，成本高，
# 而本项目"发布必须人工"的既有姿态也要求产物只在发布时生成。
name: Build (Linux)

on:
  workflow_call:
    inputs:
      publish_assets:
        description: "构建后把更新资产发布到资源服务器（会让用户收到自动更新）"
        type: boolean
        default: false
    outputs:
      version:
        description: "仓库里构建出的版本号"
        value: ${{ jobs.prepare.outputs.version }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # 版本号与一致性校验单独一个 job：两个构建 job 都要用它，
  # 而 `outputs` 需要来自某个 job —— 放在这里避免重复读文件。
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 读取并校验版本号
        id: version
        run: |
          V=$(node scripts/check-version.mjs --print)
          if [ -z "$V" ]; then echo "读取版本号失败"; exit 1; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "版本号 = $V"

  # 常规 Linux 产物：deb / AppImage / 裸二进制。
  # 顺便跑一次测试 —— Linux 上的行为与 Windows 有差异（路径、权限、locale），
  # 这里跑一遍比等用户反馈便宜。
  build:
    needs: prepare
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 安装系统依赖（Tauri Linux 必需）
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libssl-dev \
            file

      - name: 安装 Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: 安装 pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable

      - name: 缓存 Rust 构建产物
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - name: 单元测试（客户端）
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      # 与 Windows 走同一个脚本：它注入 MC_LINK_BUILD_CHANNEL=official，
      # 客户端据此才允许自动更新（裸构建会被判为"自行构建"，永远更新不了）。
      #
      # `bundle.targets` 已含 deb/appimage（见 tauri.conf.json），无需 --bundles。
      - name: 构建并签名
        run: node scripts/tauri-build.mjs build --no-bump --no-upload
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # 生成 latest.json / tauri.json（与 Windows 同一脚本）。
      # 必须在 flatpak job 之前跑：Flatpak manifest 以 deb 为输入，而
      # make-update 会把 deb 复制到 Assets/update/ 下供上传。
      - name: 生成更新清单
        run: node scripts/make-update.mjs --platform linux-x86_64
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: 收集 Linux 产物
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mc-link-linux-${{ needs.prepare.outputs.version }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/mc-link
            assets-server/Assets/update/*.deb
            assets-server/Assets/update/*.AppImage
          if-no-files-found: warn

      # 更新清单与 Windows job 各自产出，发布时都在同一个 Release 里合并。
      - name: 收集更新清单（仅发布）
        if: ${{ inputs.publish_assets }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: update-manifests-linux-${{ needs.prepare.outputs.version }}
          path: |
            assets-server/Assets/update/latest.json
            assets-server/Assets/update/tauri.json
          if-no-files-found: error

      # Flatpak manifest 需要 deb 作为输入。把 deb 单独传一份给下一个 job
      # （artifact 不能跨 job 共享文件，只能显式传递）。
      - name: 传递 deb 给 Flatpak job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flatpak-input-deb-${{ needs.prepare.outputs.version }}
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

  # Flatpak：独立 job（需要 privileged 容器）。
  flatpak:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    container:
      # 镜像 tag 里的 `gnome-NN` 必须与 manifest 的 `runtime-version` 一致，
      # 否则 flatpak-builder 会在容器里再下一份 runtime（慢，且可能版本不匹配）。
      # 改这里时同步改 build-aux/flatpak/com.cugo.mc-link.yml 的 runtime-version。
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-46
      options: --privileged
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 下载 deb（Flatpak 的构建输入）
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: flatpak-input-deb-${{ needs.prepare.outputs.version }}
          path: deb-in

      # manifest 里的 source 路径是相对 manifest 的 `mc-link.deb`，
      # 所以把下载到的 deb 放成那个名字。
      - name: 布置 manifest 输入
        run: |
          set -e
          DEB=$(find deb-in -name '*.deb' | head -n1)
          if [ -z "$DEB" ]; then echo "没有找到 deb，无法构建 Flatpak"; exit 1; fi
          cp "$DEB" build-aux/flatpak/mc-link.deb
          ls -la build-aux/flatpak/

      - name: 构建 Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6
        with:
          bundle: ${{ needs.prepare.outputs.version }}-mc-link.flatpak
          manifest-path: build-aux/flatpak/com.cugo.mc-link.yml
          cache-key: flatpak-builder-${{ github.sha }}
          # 产物由下面的步骤统一收集上传（这里交给 action 会产生第二个 artifact）
          upload-artifact: false

      - name: 收集 Flatpak 产物
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mc-link-flatpak-${{ needs.prepare.outputs.version }}
          path: "*.flatpak"
          if-no-files-found: error

  # OSTree 仓库导入**必须放在普通 runner 上**，不能留在上面的 flatpak 容器里。
  #
  # 原因：`flatpak-builder` action 把 job 放进 `ghcr.io/flathub-infra/...` 容器，
  # 那里有 flatpak/flatpak-builder，但**没有 Node.js**（源码是挂载进去的，
  # 运行时不在容器内）。在容器里跑 `node scripts/flatpak-repo.mjs` 会以
  # `node: command not found`（exit 127）失败 —— 实测踩过一次。
  #
  # `continue-on-error`：仓库导入只是"让 Flatpak 用户能 flatpak update"这一步，
  # 失败不该让已经构建好的 .flatpak 包与更新清单白费。资源服务器未备案期间
  # 这一步本来就推不上去，更不该拖垮整条发布。
  flatpak-repo:
    needs: [prepare, build, flatpak]
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 安装 Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: 安装 flatpak
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak
          # 导入/更新仓库只需 flatpak 本体，不需要 flatpak-builder 与 runtime
          flatpak --version

      - name: 下载 Flatpak 产物
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: mc-link-flatpak-${{ needs.prepare.outputs.version }}
          path: flatpak-in

      - name: 布置更新目录
        run: |
          set -e
          mkdir -p assets-server/Assets/update
          F=$(find flatpak-in -name '*.flatpak' | head -n1)
          if [ -z "$F" ]; then echo "没有找到 .flatpak"; exit 1; fi
          cp "$F" "assets-server/Assets/update/MC-Link-${{ needs.prepare.outputs.version }}-linux-x86_64-flatpak.flatpak"
          echo "已放入: assets-server/Assets/update/"
          ls -la assets-server/Assets/update/

      - name: 导入 OSTree 仓库并生成 remote 描述
        env:
          FLATPAK_GPG_KEY: ${{ secrets.FLATPAK_GPG_KEY }}
          FLATPAK_GPG_PUBLIC_KEY: ${{ secrets.FLATPAK_GPG_PUBLIC_KEY }}
          FLATPAK_REPO_URL: https://mclinkassets.xigo.top:54789/flatpak/repo
        run: node scripts/flatpak-repo.mjs

      - name: 收集 Flatpak 仓库（仅发布）
        if: ${{ inputs.publish_assets }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flatpak-repo-${{ needs.prepare.outputs.version }}
          path: assets-server/Assets/flatpak/
          if-no-files-found: error
