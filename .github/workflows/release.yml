# 发布：构建、签名，并把更新资产发布到资源服务器（用户据此自动更新）。
#
# 两条入口：
# - 推 tag（v*）：常规路径
# - workflow_dispatch（手动）：当"自动构建"已经替这个版本建过发行版、tag 也随之存在时，
#   再推同一个 tag 不会触发本流程 —— 用这个入口做正式的"发布给用户"。
name: Release

on:
  push:
    tags:
      - "v*"
      # 排除带后缀的预发布/快照标签（如 v0.4.0-snapshot）：
      # 否则推一个内部快照标签就会触发完整发布流程（构建 + 签名 + 上传更新资产）。
      - "!v*-*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build-windows.yml
    with:
      # 这一步会刷新更新清单，让所有客户端开始自动更新 —— 发布路径的意义就在这里
      publish_assets: true
    secrets: inherit
