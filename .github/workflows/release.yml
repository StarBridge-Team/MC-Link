# 发布：构建、签名，把更新资产发布到资源服务器，并把更新清单挂上 GitHub 发行版。
#
# 两条入口：
# - 推 tag（v*）：常规路径
# - workflow_dispatch（手动）：当"自动构建"已经替这个版本建过发行版、tag 也随之存在时，
#   再推同一个 tag 不会触发本流程 —— 用这个入口做正式的"发布给用户"。
#
# **更新清单只在这条路径挂载**（GitHub 与资源服务器都是）：客户端检查更新的顺序是
# GitHub 发行版 → 优选代理 → 资源服务器，三者都由本流程刷新。自动构建
# （auto-release.yml）只挂二进制产物，不挂清单，所以打完包不等于推给用户。
name: Release

on:
  push:
    tags:
      - "v*"
      # 排除带后缀的预发布/快照标签（如 v0.4.0-snapshot）：
      # 否则推一个内部快照标签就会触发完整发布流程（构建 + 签名 + 上传更新资产）。
      - "!v*-*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build-windows.yml
    with:
      # 这一步会刷新更新清单，让所有客户端开始自动更新 —— 发布路径的意义就在这里
      publish_assets: true
    secrets: inherit

  # Linux 产物（deb / AppImage / 裸二进制 / flatpak）。与 Windows 并行，
  # 互不依赖：任一平台失败不该把另一个平台的产物扣住不挂。
  #
  # Flatpak 需要的 `--privileged` 容器在它自己的 job 里，见 build-linux.yml。
  build-linux:
    uses: ./.github/workflows/build-linux.yml
    with:
      publish_assets: true
    secrets: inherit

  # 把更新清单挂到 GitHub 发行版：客户端的第一优先更新源就是这里，
  # 没有这一步，客户端会一路回退到资源服务器（等于 GitHub 加速形同虚设）。
  #
  # `!cancelled()` 而不是默认的"needs 成功才跑"：资源服务器等兜底环节失败时，
  # 构建产物与本地生成的清单其实已经就绪——只要流水线没被手动取消，
  # 就应当把它们挂上去，别让一个兜底源的故障废掉整次发布。
  publish-github:
    needs: [build, build-linux]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 读取并校验版本号
        id: version
        run: |
          VERSION=$(node scripts/check-version.mjs --print)
          if [ -z "$VERSION" ]; then echo "读取版本号失败"; exit 1; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      # 手动触发时 tag 可能已存在（自动构建建的），也可能不存在（直接跑本流程）。
      # gh release create 已带 --verify-tag 会因"tag 已存在"失败，所以先判断。
      - name: 确保发行版存在
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
              # tag 已存在（自动构建创建的）：用 --target 指向该 tag 的提交
              gh release create "$TAG" --target "${{ github.sha }}" \
                --title "MC Link ${{ steps.version.outputs.version }}" --generate-notes
            else
              # tag 不存在：创建并推（本流程作为唯一发布入口）
              gh release create "$TAG" --title "MC Link ${{ steps.version.outputs.version }}" --generate-notes
            fi
          fi

      # 三个下载都容错：build job 可能因兜底环节失败而没有产出对应 artifact，
      # 此时能挂多少挂多少。每个文件在挂载前都会再判一次是否存在。
      - name: 下载更新清单
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: update-manifests-${{ steps.version.outputs.version }}
          path: manifests

      - name: 下载 Tauri 配置
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: tauri-conf-${{ steps.version.outputs.version }}
          path: tauri-conf

      # 产物也在这里挂：推 tag 的路径不经过 auto-release（它只响应 main 的推送），
      # 而客户端下载更新包走的是 GitHub 发行版直链——清单挂上、产物缺席，
      # 客户端就会在"清单说有新版本、包却 404"上回退资源服务器，GitHub 加速形同虚设。
      # auto-release 已挂过同名产物时 --clobber 覆盖为本次构建的，内容一致。
      - name: 下载构建产物
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: mc-link-windows-${{ steps.version.outputs.version }}
          path: dist

      # Linux 产物放到 dist 下的独立子目录：与 Windows 产物分开，
      # 避免同名文件互相覆盖（两者都有 MC-Link-<ver>-... 前缀但不重名，
      # 分开是为了让 `find dist` 的结果一眼能看出平台）。
      - name: 下载 Linux 产物
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: mc-link-linux-${{ steps.version.outputs.version }}
          path: dist/linux

      - name: 下载 Flatpak 产物
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: mc-link-flatpak-${{ steps.version.outputs.version }}
          path: dist/flatpak

      # 产物文件名里有空格（"MC Link_0.4.7_x64-setup.exe"），所以不能用通配展开，
      # 用 NUL 分隔读进数组再以数组传参。清单与配置名固定；tauri.json 在未配置
      # 签名私钥时不会生成，缺失就跳过（插件路径会安静地回退资源服务器清单）。
      # 逐项判存在，空集合时明确失败而不是静默成功——真挂上零个文件是故障。
      #
      # 不能用 `--clobber` 一把梭：它内部是"逐个查同名 → 删 → 传"，
      # 而 dist 里同时含 nsis/ 与 update/ 两处产物、且存在同名文件，
      # 并发删除会让某个 asset 已被删却被再删一次，报 HTTP 404 并中断整批上传
      # （实测 7 个只挂上 5 个）。这里改成显式先删后传，逐个来。
      - name: 挂载产物、清单与配置到发行版
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          UPLOAD=()
          for f in manifests/latest.json manifests/tauri.json tauri-conf/tauri.conf.json; do
            if [ -f "$f" ]; then UPLOAD+=("$f"); else echo "缺失（跳过）: $f"; fi
          done
          mapfile -d '' ARTIFACTS < <(find dist -type f -print0 2>/dev/null)
          UPLOAD+=("${ARTIFACTS[@]}")
          if [ ${#UPLOAD[@]} -eq 0 ]; then
            echo "没有任何可挂载的文件：构建产物与清单都不存在"
            exit 1
          fi
          printf '待挂载 %d 个文件\n' "${#UPLOAD[@]}"
          # 逐个"先删后传"。**不要**在末尾再来一次 `--clobber` 批量上传：
          # 上面这轮已经把 UPLOAD 全部传完了，再传一遍纯属冗余，
          # 而 `--clobber` 内部的并发删除正是本段注释警告过的失败源
          # （被测出"7 个只挂上 5 个"）。
          for f in "${UPLOAD[@]}"; do
            name=$(basename "$f")
            # 先删同名（不存在时 gh 返回非零，忽略）
            gh release delete-asset "$TAG" "$name" -y >/dev/null 2>&1 || true
            echo "上传 $name"
            gh release upload "$TAG" "$f"
          done
          echo "全部挂载完成（${#UPLOAD[@]} 个文件）"
