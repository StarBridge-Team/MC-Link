# 提交检查：格式、clippy、类型与测试。
#
# 与 release.yml 分开的理由：检查要快、每次 push/PR 都跑；发布要慢、只在打 tag 时跑。
# 原先两者混在一个 build.yml 里，导致"检查"其实在构建安装包，既慢又跑不起来。
name: Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    # 用 Windows runner：本应用的主目标是 Windows，且 Linux 跑 Tauri 需要
    # webkit2gtk 等一堆系统依赖，检查阶段没必要引入这些变量。
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 不能同时写 `version:`：package.json 里有 `packageManager: pnpm@10.14.x+sha1...`，
      # 两处都声明会让 action-setup 直接报「Multiple versions of pnpm specified」而失败。
      # 省略 version 时它会读 packageManager —— 顺带保证 CI 用的版本与 lockfile 一致。
      - name: 安装 pnpm
        uses: pnpm/action-setup@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: 缓存 Rust 构建产物
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      # 先构建前端：`tauri-build` 会检查 frontendDist（../dist）是否存在，
      # 没构建过的话后面的 cargo 命令会直接失败。顺带完成 vue-tsc 类型检查。
      - name: 类型检查与前端构建
        run: pnpm build

      # 格式与 Clippy 目前**不阻塞**（continue-on-error）：
      # 仓库尚未做过一次统一的格式化（当前 168 处不一致，集中在 plugin/ 模块），
      # 既有 Clippy 告警也分散在多个模块。直接开成阻塞会第一次推送就红，
      # 而"永远红的关卡会被无视"——那比没有关卡更糟。
      #
      # 待这轮重构提交落定后恢复阻塞：
      #   cargo fmt --all
      #   cargo clippy --all-targets --fix --allow-dirty
      # 清掉剩余告警后，删掉这两处 continue-on-error。
      - name: 格式检查（暂不阻塞）
        continue-on-error: true
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Clippy（暂不阻塞）
        continue-on-error: true
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: 单元测试（客户端）
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: 单元测试（资源服务器）
        run: cargo test --manifest-path assets-server/Cargo.toml

      - name: 架构守卫
        run: node scripts/check-arch.mjs
