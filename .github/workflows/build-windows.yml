# 可复用的 Windows 构建：构建 + 签名，可选"发布到资源服务器"。
#
# 被两条路径调用，差别只在最后一步：
# - release.yml（推 tag v* / 手动触发）→ publish_assets: true，用户会收到自动更新
# - auto-release.yml（版本号变更的提交）→ publish_assets: false，只挂 GitHub 发行版
#
# **为什么把"构建归档"和"发布给用户"分开**：构建产物挂到发行版只是归档，不碰任何
# 现有用户；而发布更新资产会让**所有**客户端立刻开始自动更新。后者必须是一个明确的
# 人工动作 —— 否则任何一个改到版本号的提交都会直接推给全体用户。
name: Build (Windows)

on:
  workflow_call:
    inputs:
      publish_assets:
        description: "构建后把更新资产发布到资源服务器（会让用户收到自动更新）"
        type: boolean
        default: false
    outputs:
      version:
        description: "仓库里构建出的版本号"
        value: ${{ jobs.build.outputs.version }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # 版本号以仓库为准（release.yml 传 --no-bump）：tag、发行版标题与产物名都用它。
      # 统一走 scripts/check-version.mjs：它同时校验三处版本号一致，且跨平台（pwsh/bash 同一份逻辑）。
      - name: 读取并校验版本号
        id: version
        run: |
          V=$(node scripts/check-version.mjs --print)
          if [ -z "$V" ]; then echo "读取版本号失败"; exit 1; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "版本号 = $V"
        shell: bash

      - name: 安装 Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      # 同 check.yml：不能与 package.json 的 packageManager 重复声明版本，
      # 否则 action-setup 会以「Multiple versions of pnpm specified」直接失败。
      - name: 安装 pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable

      - name: 缓存 Rust 构建产物
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      # 发布构建 + 签名 + 生成更新清单
      #
      # 必须走 scripts/tauri-build.mjs（而不是裸 pnpm tauri build）：只有它会给构建注入
      # MC_LINK_BUILD_CHANNEL=official，客户端据此才允许自动更新。裸构建出来的产物会被判为
      # "自行构建" —— 不会报错，只是永远更新不了，属于最难排查的一类问题。
      #
      # --no-bump：版本号以仓库为准，CI 不改动 package.json / tauri.conf.json
      - name: 构建并签名
        run: node scripts/tauri-build.mjs build --no-bump --no-upload
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # 资源服务器是**兜底**来源（客户端优先级：GitHub → 代理 → 资源服务器），
      # 而且当前尚未备案、实际不可达。因此这里刻意 continue-on-error：
      # 上传失败不该让整个过程失败——否则产物收集与 publish-github（挂 GitHub 发行版，
      # 也就是客户端的第一更新源）会被连锁 skip，一次发布一个文件都挂不上去。
      # 账号/备案就绪后删掉 continue-on-error，恢复"兜底源必须刷新"的强约束。
      - name: 发布更新资产到资源服务器
        if: ${{ inputs.publish_assets }}
        continue-on-error: true
        run: node scripts/sync-assets.mjs --prod
        env:
          ASSET_UPLOAD_TOKEN: ${{ secrets.ASSET_UPLOAD_TOKEN }}
          ASSET_UPLOAD_REQUIRED: "1"

      # 顺带刷新关于页的社区数据（同一台资源服务器，不额外增加流程）
      - name: 刷新社区数据（贡献者 / Issues）
        if: ${{ inputs.publish_assets }}
        continue-on-error: true
        run: node scripts/sync-community.mjs --prod
        env:
          ASSET_UPLOAD_TOKEN: ${{ secrets.ASSET_UPLOAD_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 产物收集刻意**不含** latest.json / tauri.json：更新清单是"让用户收到更新"
      # 的开关，只能随发布流程（release.yml）挂载。自动构建若把清单挂上发行版，
      # 客户端的第一更新源（GitHub Release）会绕开人工发布闸门，直接把版本推给所有人。
      # 更新包本体（exe/zip）可以提前挂——没有清单，没有客户端会去找它们。
      - name: 收集产物
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mc-link-windows-${{ steps.version.outputs.version }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            assets-server/Assets/update/*.zip
            assets-server/Assets/update/*.exe
          if-no-files-found: warn

      # 更新清单只在发布路径产出：release.yml 拿到它挂上 GitHub Release 之后，
      # 客户端的"GitHub 优先"检查才会看见这个版本。
      - name: 收集更新清单（仅发布）
        if: ${{ inputs.publish_assets }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: update-manifests-${{ steps.version.outputs.version }}
          path: |
            assets-server/Assets/update/latest.json
            assets-server/Assets/update/tauri.json
          if-no-files-found: error

      # Tauri 配置单独成一个 artifact：发版时与安装包一起挂到 GitHub 发行版，
      # 供下游脚本 / 用户读取构建时的版本与更新端点。
      # 单独存放是为了让挂载后的文件名保持 tauri.conf.json，不带 src-tauri/ 目录前缀。
      - name: 收集 Tauri 配置
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tauri-conf-${{ steps.version.outputs.version }}
          path: src-tauri/tauri.conf.json
          if-no-files-found: error
