<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MC Link</title>
<style>
:root {
  --bg: #0f0f12;
  --card-bg: rgba(28,28,36,0.92);
  --card-border: rgba(255,255,255,0.06);
  --text: #e4e4e7;
  --text-secondary: #a1a1aa;
  --input-bg: rgba(255,255,255,0.04);
  --input-border: rgba(255,255,255,0.08);
  --accent: #4c9aff;
  --accent-hover: #3a7de0;
  --danger: #ef4444;
  --success: #22c55e;
  --radius: 10px;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #f0f0f5;
    --card-bg: rgba(255,255,255,0.88);
    --card-border: rgba(0,0,0,0.06);
    --text: #1a1a2e;
    --text-secondary: #6b7280;
    --input-bg: rgba(0,0,0,0.03);
    --input-border: rgba(0,0,0,0.1);
  }
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  display: flex;
  overflow: hidden;
}
.mask {
  width: 460px;
  min-width: 460px;
  height: 100vh;
  background: var(--card-bg);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border-right: 1px solid var(--card-border);
  display: flex;
  flex-direction: column;
  padding: 48px 40px;
  overflow-y: auto;
}
.bg-area {
  flex: 1;
  background: linear-gradient(135deg, rgba(76,154,255,0.08), transparent 50%);
}
.logo {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 36px;
}
.logo img { width: 40px; height: 40px; border-radius: 8px; }
.logo span { font-size: 20px; font-weight: 700; letter-spacing: -.3px; }
.tabs {
  display: flex;
  gap: 4px;
  margin-bottom: 28px;
  padding: 4px;
  background: var(--input-bg);
  border-radius: var(--radius);
}
.tab {
  flex: 1;
  text-align: center;
  padding: 8px 0;
  font-size: 13px;
  font-weight: 500;
  border-radius: 8px;
  cursor: pointer;
  color: var(--text-secondary);
  transition: .15s;
  user-select: none;
}
.tab.active { background: var(--card-border); color: var(--text); }
.tab[data-tab]:not(.active):hover { color: var(--text); }
.panel { display: none; }
.panel.active { display: block; }
.field-group { margin-bottom: 16px; }
.field-group label {
  display: block;
  font-size: 12px;
  font-weight: 500;
  color: var(--text-secondary);
  margin-bottom: 6px;
}
input[type="text"], input[type="password"] {
  width: 100%;
  padding: 10px 14px;
  background: var(--input-bg);
  border: 1px solid var(--input-border);
  border-radius: 8px;
  color: var(--text);
  font-size: 14px;
  outline: none;
  transition: .15s;
}
input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(76,154,255,0.15); }
input::placeholder { color: var(--text-secondary); opacity: .5; }
.btn {
  width: 100%;
  padding: 10px;
  border: none;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: .15s;
}
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
.msg {
  font-size: 13px;
  padding: 8px 12px;
  border-radius: 8px;
  margin-top: 12px;
  display: none;
}
.msg.error { display: block; background: rgba(239,68,68,0.1); color: var(--danger); }
.msg.info { display: block; background: rgba(76,154,255,0.1); color: var(--accent); }
.msg.success { display: block; background: rgba(34,197,94,0.1); color: var(--success); }
.footer-links {
  margin-top: 16px;
  text-align: center;
  font-size: 13px;
  color: var(--text-secondary);
}
.footer-links a {
  color: var(--accent);
  text-decoration: none;
  cursor: pointer;
}
.footer-links a:hover { text-decoration: underline; }
.footer-links .sep { margin: 0 8px; color: var(--input-border); }
</style>
</head>
<body>
<div class="mask">
  <div class="logo">
    <img src="/mc-link-icon.png" alt="MC Link" onerror="this.style.display='none'">
    <span>MC Link</span>
  </div>

  <div class="tabs">
    <div class="tab active" data-tab="login" onclick="switchTab('login')">登录</div>
    <div class="tab" data-tab="register" onclick="switchTab('register')">注册</div>
  </div>

  <!-- 登录 -->
  <div class="panel active" id="panel-login">
    <div class="field-group">
      <label>用户名</label>
      <input type="text" id="loginUser" placeholder="输入用户名" autocomplete="username" onkeydown="if(event.key==='Enter')passwordLogin()">
    </div>
    <div class="field-group">
      <label>密码</label>
      <input type="password" id="loginPass" placeholder="输入密码" autocomplete="current-password" onkeydown="if(event.key==='Enter')passwordLogin()">
    </div>
    <button class="btn btn-primary" id="loginBtn" onclick="passwordLogin()">登录</button>
    <div class="msg" id="loginMsg"></div>
  </div>

  <!-- 注册 -->
  <div class="panel" id="panel-register">
    <div class="field-group">
      <label>用户名（2-20 个字符）</label>
      <input type="text" id="regUser" placeholder="输入用户名" maxlength="20" autocomplete="username" onkeydown="if(event.key==='Enter')regSubmit()">
    </div>
    <div class="field-group">
      <label>密码</label>
      <input type="password" id="regPass" placeholder="输入密码" autocomplete="new-password" onkeydown="if(event.key==='Enter')regSubmit()">
    </div>
    <div class="field-group">
      <label>确认密码</label>
      <input type="password" id="regPass2" placeholder="再次输入密码" autocomplete="new-password" onkeydown="if(event.key==='Enter')regSubmit()">
    </div>
    <button class="btn btn-primary" id="regBtn" onclick="regSubmit()">注册</button>
    <div class="msg" id="regMsg"></div>
  </div>

  <div style="flex:1;"></div>
  <div class="footer-links" id="footer-links">
    <a onclick="switchTab('register')">还没有注册？去注册</a>
  </div>
</div>
<div class="bg-area"></div>

<script>
const urlParams = new URLSearchParams(window.location.search);
const redirectUri = urlParams.get('redirect_uri');
const desktopAppId = urlParams.get('app_id');
const desktopSession = urlParams.get('session');
const isDesktopLogin = !!(desktopAppId && desktopSession);

async function sha256(str) {
  const encoder = new TextEncoder();
  const data = encoder.encode(str);
  const hash = await crypto.subtle.digest('SHA-256', data);
  return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
}

function showMsg(id, msg, type) {
  const el = document.getElementById(id);
  if (!msg) { el.className = 'msg'; el.textContent = ''; return; }
  el.className = 'msg ' + type;
  el.textContent = msg;
}

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + tab));
  const footer = document.getElementById('footer-links');
  footer.innerHTML = tab === 'login'
    ? '<a onclick="switchTab(\'register\')">还没有注册？去注册</a>'
    : '<a onclick="switchTab(\'login\')">已有账号？去登录</a>';
}

function redirectToClient(token, name) {
  if (redirectUri) {
    const sep = redirectUri.includes('?') ? '&' : '?';
    window.location.href = redirectUri + sep + 'token=' + encodeURIComponent(token) + '&name=' + encodeURIComponent(name);
  }
}

// ===== 登录 =====
async function passwordLogin() {
  const user = document.getElementById('loginUser').value.trim();
  const pass = document.getElementById('loginPass').value;
  if (!user || !pass) { showMsg('loginMsg', '请输入用户名和密码', 'error'); return; }

  const btn = document.getElementById('loginBtn');
  btn.disabled = true; btn.textContent = '登录中...';
  showMsg('loginMsg', '', '');

  const password_hashed = await sha256(pass);

  fetch('/api/auth/password-login', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username: user, password_hashed })
  }).then(r => r.json()).then(d => {
    btn.disabled = false; btn.textContent = '登录';
    if (d.code === 0) {
      if (isDesktopLogin) {
        // 桌面登录：调用授权接口
        fetch('/api/auth/desktop/authorize', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ app_id: desktopAppId, session: desktopSession, token: d.token })
        }).then(r => r.json()).then(auth => {
          if (auth.code === 0) {
            showMsg('loginMsg', '授权成功！请返回桌面应用继续。', 'success');
          } else {
            showMsg('loginMsg', auth.error || '授权失败', 'error');
          }
        }).catch(() => {
          showMsg('loginMsg', '授权请求失败', 'error');
        });
      } else {
        redirectToClient(d.token, d.name) || showMsg('loginMsg', '登录成功！请关闭此页面。', 'success');
      }
    } else {
      showMsg('loginMsg', d.error || '登录失败', 'error');
    }
  }).catch(() => {
    btn.disabled = false; btn.textContent = '登录';
    showMsg('loginMsg', '网络错误', 'error');
  });
}

// ===== 注册 =====
async function regSubmit() {
  const user = document.getElementById('regUser').value.trim();
  const pass = document.getElementById('regPass').value;
  const pass2 = document.getElementById('regPass2').value;

  if (!user || user.length < 2) { showMsg('regMsg', '用户名至少 2 个字符', 'error'); return; }
  if (user.length > 20) { showMsg('regMsg', '用户名不超过 20 个字符', 'error'); return; }
  if (!pass) { showMsg('regMsg', '请输入密码', 'error'); return; }
  if (pass !== pass2) { showMsg('regMsg', '两次密码不一致', 'error'); return; }

  const btn = document.getElementById('regBtn');
  btn.disabled = true; btn.textContent = '注册中...';
  showMsg('regMsg', '', '');

  const password_hashed = await sha256(pass);

  fetch('/api/auth/direct-register', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username: user, password_hashed })
  }).then(r => r.json()).then(d => {
    btn.disabled = false; btn.textContent = '注册';
    if (d.code === 0) {
      redirectToClient(d.token, d.name) || showMsg('regMsg', '注册成功！请关闭此页面。', 'success');
    } else {
      showMsg('regMsg', d.error || '注册失败', 'error');
    }
  }).catch(() => {
    btn.disabled = false; btn.textContent = '注册';
    showMsg('regMsg', '网络错误', 'error');
  });
}
</script>
</body>
</html>
