<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MC Link 中央管理面板</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
  :root { --bg: #1a1b1e; --card: #25262b; --border: #373a40; --text: #c1c2c5; --text-dim: #909296; --accent: #4c9aff; --green: #51cf66; --red: #ff6b6b; --yellow: #fcc419; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
  .header { background: var(--card); border-bottom: 1px solid var(--border); padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
  .header h1 { font-size: 18px; color: #fff; }
  .header .right { display: flex; align-items: center; gap: 12px; }
  .header span { color: var(--text-dim); font-size: 13px; }
  .refresh-btn { background: var(--accent); color: #fff; border: none; padding: 6px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; }
  .refresh-btn:hover { opacity: .85; }
  .logout-btn { background: transparent; color: var(--text-dim); border: 1px solid var(--border); padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; }
  .logout-btn:hover { border-color: var(--red); color: var(--red); }
  .tabs { display: flex; gap: 0; background: var(--card); border-bottom: 1px solid var(--border); padding: 0 24px; }
  .tab { padding: 10px 20px; cursor: pointer; color: var(--text-dim); font-size: 14px; border-bottom: 2px solid transparent; transition: .15s; }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .content { padding: 20px 24px; display: none; }
  .content.active { display: block; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
  .card .label { font-size: 12px; color: var(--text-dim); text-transform: uppercase; letter-spacing: .5px; }
  .card .value { font-size: 28px; font-weight: 600; color: #fff; margin-top: 4px; }
  .card .sub { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
  .chart-container { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 20px; }
  .chart-container canvas { max-height: 250px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 8px 12px; text-align: left; border-bottom: 1px solid var(--border); }
  th { color: var(--text-dim); font-weight: 500; font-size: 12px; text-transform: uppercase; letter-spacing: .5px; }
  td { color: var(--text); }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; }
  .badge.on { background: rgba(81,207,102,.15); color: var(--green); }
  .badge.off { background: rgba(255,107,107,.15); color: var(--red); }
  .badge.relay { background: rgba(76,154,255,.15); color: var(--accent); }
  .badge.private { background: rgba(252,196,25,.15); color: var(--yellow); }
  .search { padding: 8px 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-size: 13px; width: 200px; margin-bottom: 12px; }
  .search:focus { outline: none; border-color: var(--accent); }
  .table-wrap { overflow-x: auto; }
  .topo-wrap { display: flex; justify-content: center; min-height: 400px; align-items: center; }
  .topo-svg { max-width: 100%; }
  .empty { color: var(--text-dim); text-align: center; padding: 40px; font-size: 14px; }
  .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.6); z-index: 100; }
  .modal-overlay.show { display: flex; align-items: center; justify-content: center; }
  .modal { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 24px; max-width: 600px; width: 90%; max-height: 80vh; overflow-y: auto; }
  .modal h3 { margin-bottom: 12px; }
  .modal-close { float: right; cursor: pointer; color: var(--text-dim); font-size: 20px; }
</style>
</head>
<body>
<div class="header">
  <h1>MC Link 中央管理面板</h1>
  <div class="right">
    <span id="updateTime">-</span>
    <button class="refresh-btn" onclick="refreshAll()">↻ 刷新</button>
    <button class="logout-btn" onclick="logout()">退出登录</button>
  </div>
</div>
<div class="tabs" id="tabs">
  <div class="tab active" onclick="switchTab('overview')">概览</div>
  <div class="tab" onclick="switchTab('relays')">中继</div>
  <div class="tab" onclick="switchTab('rooms')">房间</div>
  <div class="tab" onclick="switchTab('paths')">路径</div>
  <div class="tab" onclick="switchTab('topology')">拓扑</div>
</div>

<div id="tab-overview" class="content active">
  <div class="cards" id="statsCards"></div>
  <div class="chart-container"><canvas id="trendChart"></canvas></div>
  <div class="cards" style="grid-template-columns:1fr 1fr">
    <div class="chart-container"><canvas id="roomPieChart"></canvas></div>
    <div class="chart-container"><canvas id="trafficBarChart"></canvas></div>
  </div>
</div>

<div id="tab-relays" class="content">
  <input class="search" id="relaySearch" placeholder="搜索中继..." oninput="filterRelays()">
  <div class="table-wrap"><table id="relayTable"><thead><tr><th>名称</th><th>地址</th><th>类型</th><th>状态</th><th>发送流量</th><th>接收流量</th><th>连接数</th><th>最后活跃</th></tr></thead><tbody></tbody></table></div>
</div>

<div id="tab-rooms" class="content">
  <div class="table-wrap"><table id="roomTable"><thead><tr><th>房间名</th><th>房主中继</th><th>密码</th><th>玩家数</th><th>路径</th><th>创建时间</th></tr></thead><tbody></tbody></table></div>
</div>

<div id="tab-paths" class="content">
  <div class="table-wrap"><table id="pathTable"><thead><tr><th>路径ID</th><th>房间</th><th>跳数</th><th>延迟(ms)</th><th>路径链</th></tr></thead><tbody></tbody></table></div>
</div>

<div id="tab-topology" class="content">
  <div class="topo-wrap" id="topoContainer"><div class="empty">加载中...</div></div>
</div>

<div class="modal-overlay" id="playerModal" onclick="if(event.target===this)closeModal()">
  <div class="modal"><span class="modal-close" onclick="closeModal()">&times;</span><h3 id="modalTitle">玩家列表</h3><div id="modalBody"></div></div>
</div>

<script>
let trendChart = null, roomPieChart = null, trafficBarChart = null;
let allRelays = [], allRooms = [];

function bytesFmt(b) {
  if (b >= 1073741824) return (b/1073741824).toFixed(2)+' GB';
  if (b >= 1048576) return (b/1048576).toFixed(1)+' MB';
  if (b >= 1024) return (b/1024).toFixed(0)+' KB';
  return b+' B';
}

function timeAgo(ts) {
  const s = Math.floor(Date.now()/1000 - ts);
  if (s < 5) return '刚刚';
  if (s < 60) return s+'秒前';
  if (s < 3600) return Math.floor(s/60)+'分钟前';
  if (s < 86400) return Math.floor(s/3600)+'小时前';
  return Math.floor(s/86400)+'天前';
}

function fmtTime(ts) {
  const d = new Date(ts*1000);
  return d.toLocaleTimeString();
}

function getToken() { return localStorage.getItem('mc_link_admin_token'); }

function authHeaders() {
  const t = getToken();
  return t ? { 'Authorization': 'Bearer ' + t } : {};
}

async function fetchJSON(url) {
  try {
    const r = await fetch(url, { headers: authHeaders() });
    if (r.status === 401) { window.location.href = '/admin/login'; return null; }
    const d = await r.json();
    if (d.data) return d;
    return d;
  } catch(e) { return null; }
}

async function refreshAll() {
  document.querySelector('.refresh-btn').textContent = '↻ 刷新中...';
  const [stats, relays, rooms, paths, topology, traffic, history] = await Promise.all([
    fetchJSON('/api/admin/stats'),
    fetchJSON('/api/admin/relays'),
    fetchJSON('/api/admin/rooms'),
    fetchJSON('/api/admin/paths'),
    fetchJSON('/api/admin/topology'),
    fetchJSON('/api/admin/traffic'),
    fetchJSON('/api/admin/history'),
  ]);
  document.querySelector('.refresh-btn').textContent = '↻ 刷新';
  document.getElementById('updateTime').textContent = '更新于 ' + new Date().toLocaleTimeString();

  if (stats) renderStats(stats);
  if (relays) { allRelays = relays.relays || []; renderRelays(allRelays); }
  if (rooms) { allRooms = rooms.rooms || []; renderRooms(allRooms); }
  if (paths) renderPaths(paths.paths || []);
  if (topology) renderTopology(topology);
  if (traffic) renderTrafficBar(traffic.traffic || []);
  if (history) renderTrend(history.snapshots || []);
}

function renderStats(d) {
  document.getElementById('statsCards').innerHTML = `
    <div class="card"><div class="label">中继在线</div><div class="value">${d.relays_online}/${d.relays_total}</div><div class="sub">在线/总数</div></div>
    <div class="card"><div class="label">活跃房间</div><div class="value">${d.rooms_active}</div></div>
    <div class="card"><div class="label">玩家总计</div><div class="value">${d.players_total}</div></div>
    <div class="card"><div class="label">活跃路径</div><div class="value">${d.paths_active}</div></div>
    <div class="card"><div class="label">平均延迟</div><div class="value">${d.avg_latency_ms.toFixed(0)}</div><div class="sub">ms</div></div>
    <div class="card"><div class="label">平均跳数</div><div class="value">${d.avg_hops.toFixed(1)}</div></div>
    <div class="card"><div class="label">总转发流量</div><div class="value">${bytesFmt(d.total_traffic_bytes)}</div></div>
  `;

  // 房间分布饼图
  if (roomPieChart) roomPieChart.destroy();
  const rc = document.getElementById('roomPieChart');
  if (rc && allRooms.length > 0) {
    roomPieChart = new Chart(rc, {
      type: 'doughnut',
      data: {
        labels: allRooms.map(r => r.name),
        datasets: [{
          data: allRooms.map(r => (r.players || []).length),
          backgroundColor: ['#4c9aff','#51cf66','#fcc419','#ff6b6b','#cc5de8','#20c997'],
        }]
      },
      options: { responsive: true, plugins: { legend: { position: 'right', labels: { color: '#c1c2c5' } } } }
    });
  }
}

function renderRelays(relays) {
  const tbody = document.querySelector('#relayTable tbody');
  tbody.innerHTML = relays.map(r => `
    <tr class="relay-row" data-name="${(r.name||'').toLowerCase()} ${(r.address||'').toLowerCase()}">
      <td>${r.name}</td>
      <td>${r.address}</td>
      <td>${r.private?'<span class="badge private">私人</span>':'<span class="badge relay">公共</span>'} ${r.service_type}</td>
      <td><span class="badge ${r.online?'on':'off'}">${r.online?'在线':'离线'}</span></td>
      <td>${bytesFmt(r.traffic_bytes_sent)}</td>
      <td>${bytesFmt(r.traffic_bytes_recv)}</td>
      <td>${r.connections}</td>
      <td>${timeAgo(r.last_seen)}</td>
    </tr>
  `).join('');
}

function filterRelays() {
  const q = document.getElementById('relaySearch').value.toLowerCase();
  document.querySelectorAll('.relay-row').forEach(r => {
    r.style.display = r.dataset.name.includes(q) ? '' : 'none';
  });
}

function renderRooms(rooms) {
  const tbody = document.querySelector('#roomTable tbody');
  tbody.innerHTML = rooms.map(r => `
    <tr>
      <td><a href="javascript:void(0)" onclick="showPlayers('${r.name}', ${JSON.stringify(r.players||[]).replace(/'/g,"\\'")})">${r.name}</a></td>
      <td style="font-size:12px">${(r.host_relay_id||'').substring(0,8)}...</td>
      <td>${r.password_hash ? '✓' : '-'}</td>
      <td>${(r.players||[]).length}</td>
      <td style="font-size:12px">${r.path ? r.path.hops.map(h=>h.node_id.substring(0,6)).join('→') : '-'}</td>
      <td>${timeAgo(r.created_at)}</td>
    </tr>
  `).join('');
}

function showPlayers(name, players) {
  document.getElementById('modalTitle').textContent = '房间 ' + name + ' - 玩家列表';
  document.getElementById('modalBody').innerHTML = players.length === 0 ? '<div class="empty">暂无玩家</div>' :
    '<table><thead><tr><th>名称</th><th>角色</th><th>加入时间</th></tr></thead><tbody>' +
    players.map(p => `<tr><td>${p.name}</td><td>${p.role}</td><td>${timeAgo(p.joined_at)}</td></tr>`).join('') +
    '</tbody></table>';
  document.getElementById('playerModal').classList.add('show');
}
function closeModal() { document.getElementById('playerModal').classList.remove('show'); }

function renderPaths(paths) {
  const tbody = document.querySelector('#pathTable tbody');
  tbody.innerHTML = paths.map(p => `
    <tr>
      <td style="font-size:12px">${p.path_id.substring(0,8)}...</td>
      <td>${p.room_name}</td>
      <td>${p.hops.length}</td>
      <td>${p.total_latency_ms}</td>
      <td style="font-size:12px">${p.hops.map(h => h.node_id.substring(0,6)).join(' → ')}</td>
    </tr>
  `).join('');
}

function renderTopology(d) {
  const container = document.getElementById('topoContainer');
  if (!d.nodes || d.nodes.length === 0) { container.innerHTML = '<div class="empty">无拓扑数据</div>'; return; }
  const r = 140, cx = 200, cy = 200;
  const n = d.nodes.length;
  let svg = `<svg class="topo-svg" viewBox="0 0 ${cx*2} ${cy*2}" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;max-width:600px">`;
  svg += `<defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#373a40" stroke-width="1.5"/></marker></defs>`;
  const positions = d.nodes.map((_, i) => ({
    x: cx + r * Math.cos(2*Math.PI*i/n - Math.PI/2),
    y: cy + r * Math.sin(2*Math.PI*i/n - Math.PI/2),
  }));
  if (d.edges) d.edges.forEach(e => {
    const ia = d.nodes.findIndex(n => n.id === e.node_a);
    const ib = d.nodes.findIndex(n => n.id === e.node_b);
    if (ia>=0 && ib>=0) {
      svg += `<line x1="${positions[ia].x}" y1="${positions[ia].y}" x2="${positions[ib].x}" y2="${positions[ib].y}" stroke="#373a40" stroke-width="2" marker-end="url(#arrow)"/>`;
      const mx = (positions[ia].x+positions[ib].x)/2, my = (positions[ia].y+positions[ib].y)/2;
      svg += `<text x="${mx}" y="${my-4}" text-anchor="middle" fill="#909296" font-size="11">${e.latency_ms}ms</text>`;
    }
  });
  positions.forEach((p, i) => {
    svg += `<circle cx="${p.x}" cy="${p.y}" r="22" fill="#25262b" stroke="#4c9aff" stroke-width="2"/>`;
    svg += `<text x="${p.x}" y="${p.y+4}" text-anchor="middle" fill="#c1c2c5" font-size="10">${d.nodes[i].name.length>8?d.nodes[i].name.substring(0,8)+'…':d.nodes[i].name}</text>`;
  });
  svg += '</svg>';
  container.innerHTML = svg;
}

function renderTrend(snapshots) {
  if (snapshots.length < 2) return;
  if (trendChart) trendChart.destroy();
  const labels = snapshots.map(s => fmtTime(s.timestamp));
  const ctx = document.getElementById('trendChart');
  if (!ctx) return;
  trendChart = new Chart(ctx, {
    type: 'line',
    data: {
      labels,
      datasets: [
        { label: '中继在线', data: snapshots.map(s=>s.online_relay_count), borderColor: '#51cf66', tension: .3, fill: false },
        { label: '房间', data: snapshots.map(s=>s.room_count), borderColor: '#4c9aff', tension: .3, fill: false },
        { label: '玩家', data: snapshots.map(s=>s.player_count), borderColor: '#fcc419', tension: .3, fill: false },
      ]
    },
    options: {
      responsive: true,
      plugins: { legend: { labels: { color: '#c1c2c5' } } },
      scales: {
        x: { ticks: { color: '#909296', maxTicksLimit: 10 }, grid: { color: '#373a40' } },
        y: { ticks: { color: '#909296' }, grid: { color: '#373a40' }, beginAtZero: true }
      }
    }
  });
}

function renderTrafficBar(traffic) {
  if (trafficBarChart) trafficBarChart.destroy();
  const ctx = document.getElementById('trafficBarChart');
  if (!ctx || traffic.length === 0) return;
  trafficBarChart = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: traffic.map(t => t.name),
      datasets: [
        { label: '发送', data: traffic.map(t=>Math.round(t.bytes_sent_total/1024)), backgroundColor: '#4c9aff' },
        { label: '接收', data: traffic.map(t=>Math.round(t.bytes_recv_total/1024)), backgroundColor: '#51cf66' },
      ]
    },
    options: {
      responsive: true,
      plugins: { legend: { labels: { color: '#c1c2c5' } } },
      scales: {
        x: { ticks: { color: '#909296' }, grid: { color: '#373a40' } },
        y: { ticks: { color: '#909296' }, grid: { color: '#373a40' }, beginAtZero: true }
      }
    }
  });
}

function switchTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
  document.querySelector(`.tab[onclick*="'${name}'"]`).classList.add('active');
  document.getElementById('tab-'+name).classList.add('active');
}

// 页面加载时验证 Token — 同步 localStorage 到 Cookie
(function() {
  const token = localStorage.getItem('mc_link_admin_token');
  if (token) {
    document.cookie = 'mc_link_token=' + token + '; path=/; max-age=604800; SameSite=Lax';
  } else {
    window.location.href = '/admin/login';
  }
})();

function logout() {
  localStorage.removeItem('mc_link_admin_token');
  document.cookie = 'mc_link_token=; path=/; max-age=0';
  window.location.href = '/admin/login';
}

refreshAll();
setInterval(refreshAll, 15000);
</script>
</body>
</html>
