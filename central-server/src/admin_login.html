<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 — MC Link 管理面板</title>
<style>
  :root {
    --bg: #0f0f13;
    --card-bg: rgba(26, 27, 35, .85);
    --card-border: rgba(42, 43, 53, .6);
    --text: #c8c9d0;
    --text-dim: #888;
    --accent: #4c9aff;
    --input-bg: rgba(15, 15, 19, .6);
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #e8eaed;
      --card-bg: rgba(255, 255, 255, .88);
      --card-border: rgba(0, 0, 0, .1);
      --text: #1a1b23;
      --text-dim: #666;
      --accent: #4c9aff;
      --input-bg: rgba(0, 0, 0, .04);
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
  }
  .mask {
    width: 460px;
    min-height: 100vh;
    padding: 40px 36px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    background: var(--card-bg);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border-right: 1px solid var(--card-border);
    flex-shrink: 0;
  }
  .mask h2 { font-size: 22px; color: var(--text); margin-bottom: 4px; }
  .mask .sub { color: var(--text-dim); font-size: 14px; margin-bottom: 28px; }
  .bg-area { flex: 1; min-height: 100vh; }
  .token-row { display: flex; gap: 8px; }
  .token-row input {
    flex: 1; padding: 10px 14px;
    background: var(--input-bg);
    border: 1px solid var(--card-border);
    border-radius: 8px;
    color: var(--text);
    font-size: 14px; font-family: monospace;
    transition: .15s;
  }
  .token-row input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(76,154,255,.15); }
  .token-row button {
    padding: 10px 20px;
    background: var(--accent); color: #fff;
    border: none; border-radius: 8px;
    font-size: 14px; font-weight: 600;
    cursor: pointer; transition: .2s; white-space: nowrap;
  }
  .token-row button:hover { opacity: .85; }
  .token-row button:disabled { opacity: .4; cursor: not-allowed; }
  .error-msg { color: #ff6b6b; font-size: 13px; text-align: center; margin-top: 12px; display: none; }
  .hint { color: var(--text-dim); font-size: 12px; text-align: center; margin-top: 16px; }
  .hint code { background: rgba(255,255,255,.05); padding: 2px 6px; border-radius: 4px; font-size: 11px; }
</style>
</head>
<body>
<div class="mask">
  <h2>MC Link 管理面板</h2>
  <div class="sub">输入管理 Token 登录</div>

  <label style="font-size:13px;color:var(--text-dim);display:block;margin-bottom:6px;">Token</label>
  <div class="token-row">
    <input type="password" id="tokenInput" placeholder="输入管理 Token..." autocomplete="off" onkeydown="if(event.key==='Enter')tokenLogin()">
    <button id="tokenLoginBtn" onclick="tokenLogin()">登录</button>
  </div>
  <div class="error-msg" id="errorMsg">Token 无效，请重试</div>
  <div class="hint">Token 保存在服务器 <code>token.json</code> 中</div>
</div>
<div class="bg-area"></div>

<script>
async function tokenLogin() {
  const token = document.getElementById('tokenInput').value.trim();
  if (!token) return;
  const btn = document.getElementById('tokenLoginBtn');
  const err = document.getElementById('errorMsg');
  btn.disabled = true;
  btn.textContent = '验证...';
  err.style.display = 'none';
  try {
    const r = await fetch('/api/auth/check', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token }) });
    const d = await r.json();
    if (d.code === 0) {
      localStorage.setItem('mc_link_admin_token', token);
      window.location.href = '/admin?token=' + encodeURIComponent(token);
    } else {
      err.style.display = 'block';
    }
  } catch(e) {
    err.textContent = '网络错误';
    err.style.display = 'block';
  }
  btn.disabled = false;
  btn.textContent = '登录';
}
</script>
</body>
</html>
