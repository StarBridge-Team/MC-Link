<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MC Link - Minecraft 联机平台</title>
<style>
  :root { --bg: #0f0f13; --card: #1a1b23; --border: #2a2b35; --text: #c8c9d0; --text-dim: #888; --accent: #4c9aff; --accent2: #7c5cfc; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
  .hero { padding: 80px 24px 60px; text-align: center; background: linear-gradient(135deg, var(--card) 0%, #111 100%); border-bottom: 1px solid var(--border); }
  .hero h1 { font-size: 48px; font-weight: 800; background: linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 16px; }
  .hero p { font-size: 18px; color: var(--text-dim); max-width: 600px; margin: 0 auto 28px; line-height: 1.6; }
  .hero .badge { display: inline-block; padding: 6px 16px; background: rgba(76,154,255,.12); border: 1px solid rgba(76,154,255,.3); border-radius: 20px; color: var(--accent); font-size: 13px; margin-bottom: 24px; }
  .btn { display: inline-block; padding: 12px 32px; border-radius: 8px; font-size: 15px; font-weight: 600; text-decoration: none; transition: .2s; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { opacity: .85; transform: translateY(-1px); }
  .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); margin-left: 12px; }
  .btn-outline:hover { border-color: var(--accent); color: var(--accent); }
  .features { max-width: 1000px; margin: 0 auto; padding: 60px 24px; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
  .feature { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 24px; }
  .feature h3 { font-size: 16px; margin-bottom: 8px; color: #fff; }
  .feature p { font-size: 14px; color: var(--text-dim); line-height: 1.5; }
  .feature .icon { font-size: 28px; margin-bottom: 12px; }
  .stats { background: var(--card); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); padding: 40px 24px; }
  .stats-inner { max-width: 1000px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; text-align: center; }
  .stat-item .stat-value { font-size: 32px; font-weight: 700; color: var(--accent); }
  .stat-item .stat-label { font-size: 13px; color: var(--text-dim); margin-top: 4px; }
  .footer { padding: 24px; text-align: center; color: var(--text-dim); font-size: 13px; }
  .footer a { color: var(--accent); text-decoration: none; }
  .footer a:hover { text-decoration: underline; }
  @media (max-width: 640px) {
    .hero h1 { font-size: 32px; }
    .hero p { font-size: 15px; }
    .stats-inner { grid-template-columns: repeat(2, 1fr); }
    .btn-outline { margin-left: 0; margin-top: 12px; }
  }
</style>
</head>
<body>
<div class="hero">
  <div class="badge">MC Link v2 — 多跳隧道协议</div>
  <h1>MC Link</h1>
  <p>高性能 Minecraft 联机平台。基于多跳中继隧道协议，稳定穿越复杂网络环境，让联机更简单。</p>
</div>

<div class="features">
  <div class="feature">
    <div class="icon">🔄</div>
    <h3>多跳隧道</h3>
    <p>自动路径规划，多中继节点转发，跨越复杂网络拓扑。</p>
  </div>
  <div class="feature">
    <div class="icon">🔒</div>
    <h3>端到端加密</h3>
    <p>AES-256-GCM 加密传输，确保联机数据安全。</p>
  </div>
  <div class="feature">
    <div class="icon">⚡</div>
    <h3>低延迟</h3>
    <p>智能延迟探测，自动选择最优路径。</p>
  </div>
  <div class="feature">
    <div class="icon">🌐</div>
    <h3>全球中继</h3>
    <p>多地部署中继节点，覆盖全球玩家。</p>
  </div>
  <div class="feature">
    <div class="icon">📦</div>
    <h3>开箱即用</h3>
    <p>Tauri 桌面客户端，快速模式秒开房间。</p>
  </div>
  <div class="feature">
    <div class="icon">💜</div>
    <h3>开源免费</h3>
    <p>完全开源，社区驱动，持续迭代。</p>
  </div>
</div>

<div class="footer">
  <p>MC Link</p>
</div>
</body>
</html>
