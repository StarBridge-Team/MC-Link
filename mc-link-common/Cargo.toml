[package]
name = "mc-link-common"
version = "0.1.0"
edition = "2021"
authors = ["棱镜Prism工作室"]
description = "MC Link 公共库 - 协议、加密、工具函数"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
aes-gcm = "0.10"
sha2 = "0.10"
hex = "0.4"
rand_core = { version = "0.6", features = ["getrandom"] }
tokio = { version = "1", features = ["io-util", "net"], optional = true }

[features]
default = []
async = ["tokio"]